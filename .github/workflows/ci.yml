name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cvc5
        run: sudo apt-get update && sudo apt-get install -y libcvc5-dev g++
      - run: cargo fmt --all
      - name: Configure C++ headers
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS=-x c++ -std=c++11 -I$(g++ -print-file-name=include) -I/usr/include/c++/$(g++ -dumpversion) -I/usr/include/x86_64-linux-gnu/c++/$(g++ -dumpversion)" >> "$GITHUB_ENV"
      - name: Test
        env:
          CVC5_INCLUDE_DIR: /usr/include
          CVC5_LIB_DIR: /usr/lib/x86_64-linux-gnu
        run: cargo test --all-targets
