name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cvc5
        run: sudo apt-get update && sudo apt-get install -y libcvc5-dev
      - run: cargo fmt --all
      - run: cargo test --all-targets
