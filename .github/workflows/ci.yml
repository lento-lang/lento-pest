name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets

  legacy-smt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Show resolved CVC5 lock entries
        run: cargo generate-lockfile && awk '/name = "cvc5"/{show=1} show{print} show && /^$/{if (++blocks == 2) exit}' Cargo.lock
      - name: Test legacy checker and SMT backend
        run: cargo test --all-targets --features legacy-typecheck
