name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Print resolved lock entries
        run: cargo generate-lockfile && sed -n '/name = "cvc5"/,/^$/p' Cargo.lock
