name: Legacy SMT backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-smt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Test CVC5-backed checker
        run: cargo test --all-targets --features legacy-typecheck
